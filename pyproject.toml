[project]
name = "ragblame"
version = "0.1.0"
description = "Find which stage of your RAG pipeline caused each wrong answer, by re-running it with that stage made perfect."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  # Pinned to versions already in the local uv cache (PyPI downloads were very slow on 2026-11-14).
  "numpy==2.4.4",
  "faiss-cpu==1.16.0",
  "sentence-transformers==6.3.0",
  "torch==2.11.0",
  "transformers==5.23.0",
  "scipy==1.17.1",
  "scikit-learn==1.8.0",
  "mlx==0.32.4",
  "mlx-lm==0.32.2",
  "rank-bm25==0.2.2",
  "pytest==9.2.0",
]

[project.scripts]
ragblame = "ragblame.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ragblame"]

[tool.pytest.ini_options]
markers = ["slow: needs real models (run with RAGBLAME_SLOW=1)"]
